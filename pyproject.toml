[project]
name = "s2-wsf-aef-overture-pair"
version = "0.1.0"
description = "S2 / WSF / AEF / Overture pair notebook: settlement growth on one H3 grid, two maps, one camera."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "marimo",
    "datafusion>=54.0.0",
    "xarray-sql>=0.3.3",
    "xarray",
    "zarr>=3",
    "h3ronpy>=0.22.0",
    "pyarrow>=25.0.0",
    "obstore>=0.9.2",
    "async-geotiff>=0.4",
    "anywidget>=0.9",
    "numpy",
    "duckdb>=1.5.5",
    "pyproj",
    "pillow",
    "shapely>=2.0",
    "rasterio",
]

[tool.uv]
package = false
